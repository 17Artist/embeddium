name: Bug report
description: Report a Gene Fork rendering or compatibility problem
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Include the exact Gene Fork version and the smallest mod combination that reproduces the problem.
  - type: textarea
    id: environment
    attributes:
      label: Versions and hardware
      description: Minecraft, Forge, Gene Fork, affected mods, operating system, GPU and driver version.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Screenshots or a short video help with visual problems.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include relevant settings, resource packs and a small test world when possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach latest.log and any crash report. Remove personal server addresses or other private information before sharing.
